[project]
name = "lfc-rest"
version = "0.1.0"
description = "The one way the tests repo calls a Databricks workspace: REST paths and their JSON, the SDK only signing in"
requires-python = ">=3.10"
dependencies = ["databricks-sdk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lfc_rest"]
