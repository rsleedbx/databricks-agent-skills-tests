[project]
name = "lfc-statschema"
version = "0.1.0"
description = "statschema's canonical schema model and DDL tools (ddl, ddl_to_schema) for the Lakeflow Connect tests"
requires-python = ">=3.10"
dependencies = ["pyyaml", "sqlglot"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["statschema", "statschema.core", "statschema.query", "statschema.tools"]
