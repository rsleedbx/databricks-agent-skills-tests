- name: warehouse
  role: dimension
  description: "Warehouse locations — 5 rows at SF=1, grows as floor(5*sqrt(SF))."
  row_count: 5
  columns:
    - name: w_warehouse_sk
      type: integer
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: w_warehouse_id
      type: varchar
      length: 16
      not_null: true
      generation: {format_pattern: upper_id, length: 16}
    - name: w_warehouse_name
      type: varchar
      length: 20
      generation:
        values:
          - "Primary Warehouse"
          - "East Distribution"
          - "West Hub"
          - "Central Logistics"
          - "South Depot"
    - name: w_warehouse_sq_ft
      type: integer
      generation: {min_value: 50000, max_value: 1000000}
    - name: w_street_number
      type: varchar
      length: 10
      generation: {min_value: 1, max_value: 9999, distribution: sequential}
    - name: w_street_name
      type: varchar
      length: 60
      generation: {format_pattern: word}
    - name: w_street_type
      type: varchar
      length: 15
      generation:
        values: ["Avenue", "Boulevard", "Circle", "Drive", "Lane", "Road", "Street"]
    - name: w_suite_number
      type: varchar
      length: 10
      generation:
        values: ["Suite 100", "Suite 200", "Ste A", "Ste B", "N/A"]
    - name: w_city
      type: varchar
      length: 60
      generation: {format_pattern: city}
    - name: w_county
      type: varchar
      length: 30
      generation: {format_pattern: word}
    - name: w_state
      type: varchar
      length: 2
      generation:
        values: ["AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"]
    - name: w_zip
      type: varchar
      length: 10
      generation: {format_pattern: zip_code}
    - name: w_country
      type: varchar
      length: 20
      generation: {values: ["United States"]}
    - name: w_gmt_offset
      type: decimal
      precision: 5
      scale: 2
      generation:
        values: [-5.0, -6.0, -7.0, -8.0]

- name: store
  role: dimension
  description: "Retail store locations — 12 rows at SF=1."
  row_count: 12
  columns:
    - name: s_store_sk
      type: integer
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: s_store_id
      type: varchar
      length: 16
      not_null: true
      generation: {format_pattern: upper_id, length: 16}
    - name: s_rec_start_date
      type: date
      generation: {min_value: "1998-01-01", max_value: "2000-01-01"}
    - name: s_rec_end_date
      type: date
      generation: {min_value: "2001-01-01", max_value: "2003-01-01"}
    - name: s_closed_date_sk
      type: integer
      generation: {min_value: 36890, max_value: 37621}
    - name: s_store_name
      type: varchar
      length: 50
      generation: {format_pattern: word}
