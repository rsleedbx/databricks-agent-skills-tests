# TPC-DS canonical schema  (TPC-DS v3 approximation)
#
# Row counts at SF=1 follow the TPC-DS specification §4.1.
# Tables whose content is fully determined by the spec are written as rules: each column a
# formula of the row number (generation: expression, and the table's formulas:).
#
# Fixed tables (do not scale with SF):
#   date_dim              73,049   (1900-01-02 → 2100-01-01)
#   time_dim              86,400   (one row per second of the day)
#   customer_demographics 1,920,800 (Cartesian product of 8 demographic attributes)
#   household_demographics 7,200   (product of income_band × buy_potential × dep/veh)
#   income_band           20
#   reason                55
#   ship_mode             20
#
# Scaling tables use row_count_per_sf; integer SF is assumed.
# Dates are date_dim keys (1 is 1900-01-02): sales from 1998-01-02 (35795) to 2003-01-02 (37621), as in the spec;
# a date that follows another (a ship date, a promotion's end) is an offset rule from it.
# Reference: https://www.tpc.org/tpc_documents_current_versions/pdf/tpc-ds_v3.2.0.pdf
#
# role: each table's role in the model, from the specification: dimension, lookup, bridge, fact, log or queue.
# Its kind is dimension for dimension and lookup, fact for the others (statschema core/model.py ROLES, KIND).
# scripts/describe.py schemas/<model>.yaml lists the tables by kind, and the model's signals:.

version: "1.0"

# signals: what a model can learn from a source built with them (lfc-source-datagen tpcds_sources), and how the data
# was made so. Two in one source: a returns rate and a delivery time, as one retailer has both.
signals:
  - name: return_propensity
    target: "store_sales lines: returned when a store_returns row has the line's sr_item_sk, sr_ticket_number"
    replaces: "the spec's returns drawn on their own: no return names a sale, so nothing predicts one"
    built_by: "lfc-source-datagen: scripts/tpc/tpcds-returns.sql (lfc_source_datagen.tpcds_sources), per source"
    causes:
      - "the item's category: fit more per mille for Clothing and Shoes (item.i_category)"
      - "the promotion: promo more per mille when the sale's promotion has p_discount_active Y"
      - "the household's income: income_step per mille per tier, income_band 1-5, 6-10, 11-15, 16-20 (ss_hdemo_sk)"
    noise: "a line comes back when a hash of its keys % 1000 is under the rate: a propensity, learned per group"
    follows: "return date lag_min + 0..lag_span-1 days after the sale, part of the quantity, the reason by the cause"
    parameters: [base, fit, promo, income_step, lag_min, lag_span]
    profiles:
      mass: "40,80,40,15,1,30"
      fashion: "60,250,60,30,1,30"
      hardlines: "20,30,20,5,1,14"
    measured: "lfc-source-datagen references/tpch-sources.md: % returned by each cause, per profile"
  - name: web_ship_delay
    target: "web_sales lines: late when ws_ship_date_sk - ws_sold_date_sk is more than promise days"
    replaces: "the spec's ship date drawn on its own: a line could ship before it sold"
    built_by: "lfc-source-datagen: scripts/tpc/tpcds-ship.sql (lfc_source_datagen.tpcds_sources), per source"
    causes:
      - "the ship mode's tier: sm_type OVERNIGHT, NEXT DAY AIR, EXPRESS 0; TWO DAY, PRIORITY 1; others 2 times mode_step"
      - "a slow warehouse: slow_wh days more when ws_warehouse_sk is a multiple of slow_every"
      - "a bulk line: bulk days more when ws_quantity is bulk_qty or more"
    noise: "handling handle_min + 0..handle_span-1 days and 0..jitter-1 days, from the keys (deterministic)"
    parameters: [promise, handle_min, handle_span, mode_step, slow_every, slow_wh, bulk_qty, bulk, jitter]
    profiles:
      express: "2,0,2,1,5,2,80,1,2"
      standard: "6,1,3,2,5,3,80,2,3"
      marketplace: "12,2,6,3,5,5,60,4,5"
    measured: "lfc-source-datagen references/tpch-sources.md: % late by each cause, per profile"
    date_keys: "days are date key differences: d_date_sk is a day number (1 is 1900-01-02), date_dim its calendar"

tables:

# ── Fixed dimension tables ──────────────────────────────────────────────────
# Their rows are the spec's, written as rules (generation: expression and the table's formulas:, statschema shape.py):
# a calendar, the seconds of a day, and Cartesian products, each column a formula of the row number n.

- name: date_dim
  role: dimension
  description: "Calendar day dimension — one row per day from 1900-01-02 to 2100-01-01 (d_date_sk 1 is 1900-01-02)."
  row_count: 73049
  # The civil date of day n by whole-number arithmetic only (days to year, month, day: March-based years of 400-year
  # eras), so every engine computes it the same: z is days since 0000-03-01, mp the month from March (0 .. 11).
  formulas:
    z:    "x.n + 693901"
    era:  "{z} DIV 146097"
    doe:  "{z} % 146097"
    yoe:  "({doe} - {doe} DIV 1460 + {doe} DIV 36524 - {doe} DIV 146096) DIV 365"
    doy:  "{doe} - (365 * {yoe} + {yoe} DIV 4 - {yoe} DIV 100)"
    mp:   "(5 * {doy} + 2) DIV 153"
    dom:  "{doy} - (153 * {mp} + 2) DIV 5 + 1"
    moy:  "{mp} + 3 - 12 * ({mp} DIV 10)"
    year: "{yoe} + 400 * {era} + {mp} DIV 10"
    qoy:  "({moy} - 1) DIV 3 + 1"
    dow:  "(x.n + 1) % 7"
    week: "(x.n + 1) DIV 7 + 1"
    md:   "{mp} * 100 + {dom}"
    leap: "CASE WHEN {year} % 4 = 0 AND ({year} % 100 <> 0 OR {year} % 400 = 0) THEN 1 ELSE 0 END"
    mlen: "CASE WHEN {mp} = 11 THEN 28 + {leap} ELSE (153 * ({mp} + 1) + 2) DIV 5 - (153 * {mp} + 2) DIV 5 END"
  columns:
    - {name: d_date_sk,           type: integer,  not_null: true, primary_key: true}
    - {name: d_date_id,           type: varchar,  length: 16, not_null: true, unique: true}
    - name: d_date
      type: date
      generation: {distribution: sequential, min_value: "1900-01-02"}
    - name: d_month_seq
      type: integer
      generation: {expression: "({year} - 1900) * 12 + {moy} - 1"}
    - name: d_week_seq
      type: integer
      generation: {expression: "{week}"}
    - name: d_quarter_seq
      type: integer
      generation: {expression: "({year} - 1900) * 4 + {qoy}"}
    - name: d_year
      type: integer
      generation: {expression: "{year}"}
    - name: d_dow
      type: integer
      description: "0 Sunday .. 6 Saturday"
      generation: {expression: "{dow}"}
    - name: d_moy
      type: integer
      generation: {expression: "{moy}"}
    - name: d_dom
      type: integer
      generation: {expression: "{dom}"}
    - name: d_qoy
      type: integer
      generation: {expression: "{qoy}"}
    - name: d_fy_year
      type: integer
      generation: {expression: "{year}"}
    - name: d_fy_quarter_seq
      type: integer
      generation: {expression: "({year} - 1900) * 4 + {qoy}"}
    - name: d_fy_week_seq
      type: integer
      generation: {expression: "{week}"}
    - name: d_day_name
      type: varchar
      length: 9
      generation: {expression: "CASE {dow} WHEN 0 THEN 'Sunday' WHEN 1 THEN 'Monday' WHEN 2 THEN 'Tuesday' WHEN 3 THEN 'Wednesday' WHEN 4 THEN 'Thursday' WHEN 5 THEN 'Friday' ELSE 'Saturday' END"}
    - name: d_quarter_name
      type: varchar
      length: 6
      generation: {expression: "CONCAT('', {year}, 'Q', {qoy})"}
    - name: d_holiday
      type: char
      length: 1
      description: "Y on New Year's Day, July 4 and Christmas Day"
      generation: {expression: "CASE WHEN {md} IN (1001, 404, 925) THEN 'Y' ELSE 'N' END"}
    - name: d_weekend
      type: char
      length: 1
      generation: {expression: "CASE WHEN {dow} IN (0, 6) THEN 'Y' ELSE 'N' END"}
    - name: d_following_holiday
      type: char
      length: 1
      generation: {expression: "CASE WHEN {md} IN (1002, 405, 926) THEN 'Y' ELSE 'N' END"}
    - name: d_first_dom
      type: integer
      description: "d_date_sk of the month's first day"
      generation: {expression: "x.n - {dom} + 1"}
    - name: d_last_dom
      type: integer
      description: "d_date_sk of the month's last day"
      generation: {expression: "x.n - {dom} + {mlen}"}
    - name: d_same_day_ly
      type: integer
      description: "d_date_sk 365 days before (below 1 in the first year)"
      generation: {expression: "x.n - 365"}
    - name: d_same_day_lq
      type: integer
      description: "d_date_sk 91 days before (below 1 in the first quarter)"
      generation: {expression: "x.n - 91"}
    - {name: d_current_day,       type: char,     length: 1, generation: {distribution: constant, values: ["N"]}}
    - {name: d_current_week,      type: char,     length: 1, generation: {distribution: constant, values: ["N"]}}
    - {name: d_current_month,     type: char,     length: 1, generation: {distribution: constant, values: ["N"]}}
    - {name: d_current_quarter,   type: char,     length: 1, generation: {distribution: constant, values: ["N"]}}
    - {name: d_current_year,      type: char,     length: 1, generation: {distribution: constant, values: ["N"]}}

- name: time_dim
  role: dimension
  description: "Time-of-day dimension — one row per second (86,400 rows); t_time_sk is the second of the day."
  row_count: 86400
  formulas:
    hour: "(x.n - 1) DIV 3600"
  columns:
    - name: t_time_sk
      type: integer
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 0}
    - {name: t_time_id,   type: varchar, length: 16, not_null: true, unique: true}
    - name: t_time
      type: integer
      generation: {distribution: sequential, min_value: 0}
    - name: t_hour
      type: integer
      generation: {distribution: block, min_value: 0, distribution_params: {block_size: 3600}}
    - name: t_minute
      type: integer
      generation: {distribution: block_cyclic, min_value: 0, distribution_params: {block_size: 60, cycle: 60}}
    - name: t_second
      type: integer
      generation: {distribution: cyclic, min_value: 0, max_value: 59}
    - name: t_am_pm
      type: char
      length: 2
      generation: {expression: "CASE WHEN {hour} < 12 THEN 'AM' ELSE 'PM' END"}
    - name: t_shift
      type: varchar
      length: 20
      description: "third 0:00-7:59, first 8:00-15:59, second 16:00-23:59"
      generation: {expression: "CASE WHEN {hour} < 8 THEN 'third' WHEN {hour} < 16 THEN 'first' ELSE 'second' END"}
    - name: t_sub_shift
      type: varchar
      length: 20
      description: "night 21:00-5:59, morning 6:00-11:59, afternoon 12:00-16:59, evening 17:00-20:59"
      generation: {expression: "CASE WHEN {hour} < 6 THEN 'night' WHEN {hour} < 12 THEN 'morning' WHEN {hour} < 17 THEN 'afternoon' WHEN {hour} < 21 THEN 'evening' ELSE 'night' END"}
    - name: t_meal_time
      type: varchar
      length: 20
      description: "breakfast 6:00-8:59, lunch 11:00-13:59, dinner 17:00-19:59, else none"
      generation: {expression: "CASE WHEN {hour} BETWEEN 6 AND 8 THEN 'breakfast' WHEN {hour} BETWEEN 11 AND 13 THEN 'lunch' WHEN {hour} BETWEEN 17 AND 19 THEN 'dinner' ELSE NULL END"}

- name: customer_demographics
  role: dimension
  description: "Full Cartesian product of 8 demographic attributes — 1,920,800 rows (cd_gender varies fastest)."
  row_count: 1920800
  formulas:
    i: "x.n - 1"
  columns:
    - {name: cd_demo_sk,            type: integer, not_null: true, primary_key: true}
    - name: cd_gender
      type: char
      length: 1
      generation: {expression: "CASE {i} % 2 WHEN 0 THEN 'M' ELSE 'F' END"}
    - name: cd_marital_status
      type: char
      length: 1
      generation: {expression: "CASE {i} DIV 2 % 5 WHEN 0 THEN 'M' WHEN 1 THEN 'S' WHEN 2 THEN 'D' WHEN 3 THEN 'W' ELSE 'U' END"}
    - name: cd_education_status
      type: varchar
      length: 20
      generation: {expression: "CASE {i} DIV 10 % 7 WHEN 0 THEN 'Primary' WHEN 1 THEN 'Secondary' WHEN 2 THEN 'College' WHEN 3 THEN '2 yr Degree' WHEN 4 THEN '4 yr Degree' WHEN 5 THEN 'Advanced Degree' ELSE 'Unknown' END"}
    - name: cd_purchase_estimate
      type: integer
      description: "500 .. 10,000 in steps of 500"
      generation: {expression: "500 + {i} DIV 70 % 20 * 500"}
    - name: cd_credit_rating
      type: varchar
      length: 10
      generation: {expression: "CASE {i} DIV 1400 % 4 WHEN 0 THEN 'Good' WHEN 1 THEN 'High Risk' WHEN 2 THEN 'Low Risk' ELSE 'Unknown' END"}
    - name: cd_dep_count
      type: integer
      generation: {expression: "{i} DIV 5600 % 7"}
    - name: cd_dep_employed_count
      type: integer
      generation: {expression: "{i} DIV 39200 % 7"}
    - name: cd_dep_college_count
      type: integer
      generation: {expression: "{i} DIV 274400 % 7"}

- name: household_demographics
  role: dimension
  description: "Product of income_band × buy_potential × dep_count × vehicle_count — 7,200 rows (the income band fastest)."
  row_count: 7200
  formulas:
    i: "x.n - 1"
  columns:
    - {name: hd_demo_sk,         type: integer, not_null: true, primary_key: true}
    - name: hd_income_band_sk
      type: integer
      generation: {distribution: cyclic, min_value: 1, max_value: 20}
    - name: hd_buy_potential
      type: varchar
      length: 15
      generation: {expression: "CASE {i} DIV 20 % 6 WHEN 0 THEN '0-500' WHEN 1 THEN '501-1000' WHEN 2 THEN '1001-5000' WHEN 3 THEN '5001-10000' WHEN 4 THEN '>10000' ELSE 'Unknown' END"}
    - name: hd_dep_count
      type: integer
      generation: {expression: "{i} DIV 120 % 10"}
    - name: hd_vehicle_count
      type: integer
      description: "-1 (unknown) .. 4"
      generation: {expression: "{i} DIV 1200 % 6 - 1"}
  fk_constraints:
    - columns: [hd_income_band_sk]
      parent_table: income_band
      parent_columns: [ib_income_band_sk]

- name: income_band
  role: lookup
  description: "20 income bracket definitions, each spanning $10,000: 0-10,000, 10,001-20,000 .. 190,001-200,000."
  row_count: 20
  columns:
    - {name: ib_income_band_sk, type: integer, not_null: true, primary_key: true}
    - name: ib_lower_bound
      type: integer
      generation: {expression: "CASE WHEN x.n = 1 THEN 0 ELSE (x.n - 1) * 10000 + 1 END"}
    - name: ib_upper_bound
      type: integer
      generation: {expression: "x.n * 10000"}

- name: reason
  role: lookup
  description: "Return-reason lookup — 55 fixed rows."
  row_count: 55
  columns:
    - name: r_reason_sk
      type: integer
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: r_reason_id
      type: varchar
      length: 16
      not_null: true
      generation: {format_pattern: upper_id, length: 16}
    - name: r_reason_desc
      type: varchar
      length: 100
      generation:
        values:
          - "Did not fit"
          - "Not as described"
          - "Better price available"
          - "No longer needed"
          - "Damaged"
          - "Wrong item shipped"
          - "Defective"
          - "Changed mind"
          - "Gift duplicate"
          - "Price discrepancy"
          - "Missing parts"
          - "Item arrived late"
          - "Ordered by mistake"
          - "Expired"
          - "Poor quality"

- name: ship_mode
  role: lookup
  description: "Shipping method lookup — 20 fixed rows."
  row_count: 20
  columns:
    - name: sm_ship_mode_sk
      type: integer
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: sm_ship_mode_id
      type: varchar
      length: 16
      not_null: true
      generation: {format_pattern: upper_id, length: 16}
    - name: sm_type
      type: varchar
      length: 30
      generation:
        values:
          - "LIBRARY"
          - "TWO DAY"
          - "NEXT DAY AIR"
          - "SURFACE"
          - "OVERNIGHT"
          - "EXPRESS"
          - "GROUND"
          - "PRIORITY"
    - name: sm_code
      type: varchar
      length: 10
      generation:
        values:
          - "EXPRESS"
          - "PRIORITY"
          - "ECONOMY"
          - "STANDARD"
    - name: sm_carrier
      type: varchar
      length: 20
      generation:
        values:
          - "Universal"
          - "Airborne"
          - "Zouros"
          - "Tribune"
          - "Diamond"
          - "Overnight"
          - "USPS"
          - "DHL"
          - "FedEx"
          - "UPS"
    - name: sm_contract
      type: varchar
      length: 20
      generation: {format_pattern: upper_id, length: 16}

# ── Scaling dimension tables ────────────────────────────────────────────────

- name: item
  role: dimension
  description: "Product catalog — 18,000 rows per SF."
  row_count_per_sf: 18000
  columns:
    - name: i_item_sk
      type: integer
      not_null: true
      primary_key: true
      generation: {distribution: sequential, min_value: 1}
    - name: i_item_id
      type: varchar
      length: 16
      not_null: true
      generation: {format_pattern: upper_id, length: 16}
    - name: i_rec_start_date
      type: date
      generation: {min_value: "1997-01-01", max_value: "2001-01-01"}
    - name: i_rec_end_date
      type: date
      generation: {min_value: "2001-01-01", max_value: "2003-01-01"}
    - name: i_item_desc
      type: varchar
      length: 200
      generation: {format_pattern: sentence}
    - name: i_current_price
      type: decimal
      precision: 7
      scale: 2
      generation: {min_value: 0.09, max_value: 300.00}
    - name: i_wholesale_cost
      type: decimal
      precision: 7
      scale: 2
      generation: {min_value: 0.05, max_value: 250.00}
    - name: i_brand_id
      type: integer
      generation: {min_value: 1, max_value: 1000}
    - name: i_brand
      type: varchar
      length: 50
      generation: {format_pattern: word}
    - name: i_class_id
      type: integer
      generation: {min_value: 1, max_value: 16}
    - name: i_class
      type: varchar
      length: 50
      generation:
        values:
          - "electronics"
          - "apparel"
          - "shoes"
          - "jewelry"
          - "home"
          - "garden"
          - "sporting"
          - "toys"
          - "books"
          - "music"
          - "video"
          - "food"
          - "health"
          - "beauty"
          - "automotive"
          - "hardware"
    - name: i_category_id
      type: integer
      generation: {min_value: 1, max_value: 10}
    - name: i_category
      type: varchar
      length: 50
      generation:
        values:
          - "Books"
          - "Music"
          - "Electronics"
          - "Clothing"
          - "Home"
          - "Sports"
          - "Shoes"
