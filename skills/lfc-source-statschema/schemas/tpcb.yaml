# TPC-B Canonical Schema — statschema interchange format
#
# This file uses stable logical names (branch, teller, account, history).
# Client-driver naming conventions are applied at pipeline time via
# rename_tables() + TABLE_NAME_PRESETS, e.g.:
#
#   from statschema.schema_transforms import rename_tables, TABLE_NAME_PRESETS
#   renamed = rename_tables(tables, TABLE_NAME_PRESETS["pgbench"])
#   # → pgbench_branches, pgbench_tellers, pgbench_accounts, pgbench_history
#
# Column names match both TPC-B spec and pgbench source exactly:
#   bid/bbalance/filler, tid/tbalance/filler, aid/abalance/filler,
#   tid/bid/aid/delta/mtime/filler — so only table names need renaming.
#
# Scale factor (SF) determines the number of branches:
#   branch   —      1 row / SF
#   teller   —     10 rows / SF
#   account  — 100,000 rows / SF
#   history  — 100,000 rows / SF  (initial population; grows during transactions)
#
# TPC-B spec: https://tpc.org/tpcb/
# pgbench reference: https://www.postgresql.org/docs/current/pgbench.html
#
# role: each table's role in the model, from the specification: dimension, lookup, bridge, fact, log or queue.
# Its kind is dimension for dimension and lookup, fact for the others (statschema core/model.py ROLES, KIND).
# scripts/describe.py schemas/<model>.yaml lists the tables by kind, and the model's signals:.

version: "1.0"
# signals: what a model can learn from a source built with them (lfc_source_datagen.signals, lfc-sources --model tpcb),
# and how the data was made so.
signals:
  - name: unusual_withdrawal
    target: "history: unusual when h_delta <= -big_min dollars (a large withdrawal)"
    replaces: "the fill's h_delta, the row number / 100: no amount means anything"
    built_by: "lfc-source-datagen: scripts/tpc/tpcb-withdrawals.sql (lfc_source_datagen.signals), per source"
    causes:
      - "a risky teller: teller more per mille when h_t_id is a multiple of teller_every"
      - "a watch-listed account: account more per mille when h_a_id is a multiple of account_every"
      - "the hour: night more per mille from night_from to before night_to (h_time's hour, wrapping past midnight)"
    noise: "a row is large when a hash of its number % 1000 is under base plus the causes: a rate, learned per group"
    follows: "the other rows +-1..normal_max dollars; every account's, teller's and branch's balance the sum of its deltas"
    not_a_cause: "the branch: one per scale-factor unit, so it rarely varies in a test source"
    parameters: [base, teller_every, teller, account_every, account, night_from, night_to, night, normal_max, big_min, big_span]
    profiles:
      retail: "5,5,60,50,150,22,6,40,500,5000,20000"
      cash_heavy: "10,5,120,20,100,20,4,60,2000,10000,40000"
      online: "2,5,10,100,300,0,5,30,300,3000,10000"
    measured: "lfc-source-datagen references/tpch-sources.md: % unusual by each cause, per profile"
    table: history
    sql: tpcb-withdrawals.sql
    at_least_1: [teller_every, account_every, normal_max, big_span]
    summary: "SELECT COUNT(*), ROUND(100.0 * AVG((h_delta <= -:big_min)::int), 1), (SELECT SUM(a_balance) FROM {s}.account) - SUM(h_delta) FROM {s}.history"
    summary_columns: [history_rows, unusual_pct, balance_gap]

tables:

  # ── branch ────────────────────────────────────────────────────────────────
  # 1 row per SF; pgbench checks COUNT(*) on its renamed version to detect SF.
  - name: branch
    role: dimension
    description: "TPC-B branch — 1 row per SF unit"
    row_count_per_sf: 1
    columns:
      - name: bid
        type: integer
        not_null: true
        primary_key: true
        description: "Branch identifier"
        generation:
          distribution: sequential
          min_value: 1
          unique: true
      - name: bbalance
        type: integer
        not_null: true
        description: "Branch balance (updated by transactions)"
        generation:
          distribution: constant
          min_value: 0
      - name: filler
        type: string
        length: 88
        description: "Padding to 100-byte row (TPC-B / pgbench spec)"
        generation:
          distribution: uniform

  # ── teller ────────────────────────────────────────────────────────────────
  # 10 rows per SF; each teller belongs to a branch.
  - name: teller
    role: dimension
    description: "TPC-B teller — 10 rows per SF unit"
    row_count_per_sf: 10
    load_after: [branch]
    columns:
      - name: tid
        type: integer
        not_null: true
        primary_key: true
        description: "Teller identifier"
        generation:
          distribution: sequential
          min_value: 1
          unique: true
      - name: bid
        type: integer
        not_null: true
        description: "Branch this teller belongs to"
        references: [branch, bid]
        generation:
          distribution: uniform
      - name: tbalance
        type: integer
        not_null: true
        description: "Teller balance (updated by transactions)"
        generation:
          distribution: constant
          min_value: 0
      - name: filler
        type: string
        length: 84
        description: "Padding to 100-byte row (TPC-B / pgbench spec)"
        generation:
          distribution: uniform

  # ── account ───────────────────────────────────────────────────────────────
  # 100,000 rows per SF; the hot table in TPC-B (every transaction touches it).
  - name: account
    role: dimension
    description: "TPC-B account — 100 000 rows per SF unit"
    row_count_per_sf: 100000
    load_after: [branch]
    columns:
      - name: aid
        type: integer
        not_null: true
        primary_key: true
        description: "Account identifier"
        generation:
          distribution: sequential
          min_value: 1
          unique: true
      - name: bid
        type: integer
        not_null: true
        description: "Home branch for this account"
        references: [branch, bid]
        generation:
          distribution: uniform
      - name: abalance
        type: integer
        not_null: true
        description: "Account balance (updated by transactions)"
        generation:
          distribution: constant
          min_value: 0
      - name: filler
        type: string
        length: 84
        description: "Padding to 100-byte row (TPC-B / pgbench spec)"
        generation:
          distribution: uniform

  # ── history ───────────────────────────────────────────────────────────────
  # No surrogate PK — append-only audit log, matches TPC-B spec.
  # pgbench inserts one row per transaction: (tid, bid, aid, delta, mtime).
  - name: history
    role: log
    description: "TPC-B history — 100 000 rows per SF unit (initial population)"
    row_count_per_sf: 100000
    load_after: [account, teller, branch]
    columns:
      - name: tid
        type: integer
        not_null: true
        description: "Teller involved in this transaction"
        references: [teller, tid]
        generation:
          distribution: uniform
      - name: bid
        type: integer
        not_null: true
        description: "Branch involved in this transaction"
        references: [branch, bid]
        generation:
          distribution: uniform
      - name: aid
        type: integer
        not_null: true
        description: "Account affected by this transaction"
        references: [account, aid]
        generation:
          distribution: uniform
      - name: delta
        type: integer
        not_null: true
        description: "Balance change applied this transaction"
        generation:
          distribution: uniform
          min_value: -999999
          max_value: 999999
      - name: mtime
        type: timestamp
        not_null: true
        description: "Transaction wall-clock time"
        generation:
          distribution: uniform
          min_value: "2020-01-01"
          max_value: "2025-12-31"
      - name: filler
        type: string
        length: 22
        description: "Padding to 50-byte row (TPC-B / pgbench spec)"
        generation:
          distribution: uniform
