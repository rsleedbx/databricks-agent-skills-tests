# Zoom into Unity Catalog with Lakeflow Connect, as a bundle: the pipeline of the docs' example
# (no public docs page yet), and its schema; target scheduled
# adds a job that runs it daily (paused until you unpause it). Deploy from the CLI (databricks bundle deploy) or from the
# workspace (open this file, Deployments, Deploy).
bundle:
  name: zoom

include:
  - resources/*.yml

variables:
  connection:
    description: The Zoom UC connection (client ID and secret of a Zoom Server-to-Server OAuth app)
    default: lfcsaas-zoom
  catalog:
    description: Catalog of the destination schema
    default: main
  schema:
    description: Destination schema, created by the bundle
    default: zoom

targets:
  dev:
    default: true
    mode: development
  # the pipeline on a daily schedule (paused until you unpause it): databricks bundle deploy -t scheduled
  scheduled:
    resources:
      jobs:
        zoom_refresh:
          name: ${var.schema}_refresh
          schedule:
            quartz_cron_expression: "0 0 6 * * ?"   # daily at 06:00
            timezone_id: UTC
            pause_status: PAUSED
          tasks:
            - task_key: refresh
              pipeline_task:
                pipeline_id: ${resources.pipelines.zoom.id}
          permissions:
            - level: CAN_VIEW
              group_name: users
