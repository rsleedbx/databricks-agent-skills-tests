resources:
  schemas:
    event_logs:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Marketo as Lakeflow Connect lands it

  pipelines:
    marketo:
      name: ${var.schema}
      catalog: ${var.catalog}
      schema: ${resources.schemas.event_logs.name}
      ingestion_definition:
        connection_name: ${var.connection}
        objects:
          # leads and static lists (source schema `default`); activity_<id> tables: see the reference page
          - table: &t {source_schema: default, source_table: leads,
                       destination_catalog: "${var.catalog}", destination_schema: "${resources.schemas.event_logs.name}"}
          - table: {<<: *t, source_table: static_lists}
      permissions:
        - level: CAN_VIEW
          group_name: users
