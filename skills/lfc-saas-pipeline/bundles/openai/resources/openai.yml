resources:
  schemas:
    event_logs:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: OpenAI as Lakeflow Connect lands it

  pipelines:
    openai:
      name: ${var.schema}
      catalog: ${var.catalog}
      schema: ${resources.schemas.event_logs.name}
      ingestion_definition:
        connection_name: ${var.connection}
        objects:
          # audit_logs, users, usage_completions (source schema `default`)
          - table: &t {source_schema: default, source_table: audit_logs,
                       destination_catalog: "${var.catalog}", destination_schema: "${resources.schemas.event_logs.name}"}
          - table: {<<: *t, source_table: users}
          - table: {<<: *t, source_table: usage_completions}
      permissions:
        - level: CAN_VIEW
          group_name: users
