# OpenAI into Unity Catalog with Lakeflow Connect, as a bundle: the pipeline of the docs' example
# (docs.databricks.com/aws/en/ingestion/lakeflow-connect/openai-pipeline), its schema, and a job that
# runs it on a schedule (paused until you unpause it). Deploy from the CLI (databricks bundle deploy) or from the
# workspace (open this file, Deployments, Deploy).
bundle:
  name: openai

include:
  - resources/*.yml

variables:
  connection:
    description: The OpenAI UC connection (an Admin API key)
    default: lfcsaas-openai
  catalog:
    description: Catalog of the destination schema
    default: main
  schema:
    description: Destination schema, created by the bundle
    default: openai

targets:
  dev:
    default: true
    mode: development
