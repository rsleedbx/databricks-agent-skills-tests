resources:
  schemas:
    event_logs:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: 1Password Event Logs as Lakeflow Connect lands them

  pipelines:
    onepassword_event_logs:
      name: ${var.schema}
      catalog: ${var.catalog}
      schema: ${resources.schemas.event_logs.name}
      ingestion_definition:
        connection_name: ${var.connection}
        objects:
          # the connector's three tables (source schema `default`); destination_table defaults to the source name
          - table: &t {source_schema: default, source_table: audit_events,
                       destination_catalog: "${var.catalog}", destination_schema: "${resources.schemas.event_logs.name}"}
          - table: {<<: *t, source_table: item_usages}
          - table: {<<: *t, source_table: sign_in_attempts}
      permissions:
        - level: CAN_VIEW
          group_name: users

  jobs:
    onepassword_event_logs_refresh:
      name: ${var.schema}_refresh
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # daily at 06:00
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: refresh
          pipeline_task:
            pipeline_id: ${resources.pipelines.onepassword_event_logs.id}
      permissions:
        - level: CAN_VIEW
          group_name: users
