# Shopify into Unity Catalog with Lakeflow Connect, as a bundle: the pipeline of the docs' example
# (docs.databricks.com/aws/en/ingestion/lakeflow-connect/shopify-pipeline), its schema, and a job that
# runs it on a schedule (paused until you unpause it). Deploy from the CLI (databricks bundle deploy) or from the
# workspace (open this file, Deployments, Deploy).
bundle:
  name: shopify

include:
  - resources/*.yml

variables:
  connection:
    description: The Shopify UC connection (client ID and secret of a Shopify app)
    default: lfcsaas-shopify
  catalog:
    description: Catalog of the destination schema
    default: main
  schema:
    description: Destination schema, created by the bundle
    default: shopify

targets:
  dev:
    default: true
    mode: development
