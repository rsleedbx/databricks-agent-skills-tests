# NetSuite into Unity Catalog with Lakeflow Connect, as a bundle: the pipeline of the docs' example
# (docs.databricks.com/aws/en/ingestion/lakeflow-connect/netsuite-pipeline), and its schema; target scheduled
# adds a job that runs it daily (paused until you unpause it). Deploy from the CLI (databricks bundle deploy) or from the
# workspace (open this file, Deployments, Deploy).
bundle:
  name: netsuite

include:
  - resources/*.yml

variables:
  connection:
    description: The NetSuite UC connection (token-based authentication; host, account and role of SuiteAnalytics Connect)
    default: lfcsaas-netsuite
  catalog:
    description: Catalog of the destination schema
    default: main
  netsuite_jar_path:
    description: NetSuite's SuiteAnalytics Connect JDBC driver in a volume (the docs' "Download the ... driver")
    default: /Volumes/main/lfcsaas_drivers/netsuite/8.10.190.0/NQjc.jar
  schema:
    description: Destination schema, created by the bundle
    default: netsuite

targets:
  dev:
    default: true
    mode: development
  # the pipeline on a daily schedule (paused until you unpause it): databricks bundle deploy -t scheduled
  scheduled:
    resources:
      jobs:
        netsuite_refresh:
          name: ${var.schema}_refresh
          schedule:
            quartz_cron_expression: "0 0 6 * * ?"   # daily at 06:00
            timezone_id: UTC
            pause_status: PAUSED
          tasks:
            - task_key: refresh
              pipeline_task:
                pipeline_id: ${resources.pipelines.netsuite.id}
          permissions:
            - level: CAN_VIEW
              group_name: users
