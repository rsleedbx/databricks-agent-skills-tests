resources:
  schemas:
    event_logs:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Adobe Commerce as Lakeflow Connect lands it

  pipelines:
    adobe_commerce:
      name: ${var.schema}
      catalog: ${var.catalog}
      schema: ${resources.schemas.event_logs.name}
      ingestion_definition:
        connection_name: ${var.connection}
        objects:
          # products, customers, orders (source schema `default`)
          - table: &t {source_schema: default, source_table: products,
                       destination_catalog: "${var.catalog}", destination_schema: "${resources.schemas.event_logs.name}"}
          - table: {<<: *t, source_table: customers}
          - table: {<<: *t, source_table: orders}
      permissions:
        - level: CAN_VIEW
          group_name: users
