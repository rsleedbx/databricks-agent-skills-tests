[project]
name = "lfc-saas-pipeline"
version = "0.1.0"
description = "The helper cells of the Lakeflow Connect SaaS pipeline notebooks (create, edit, start, wait), as a package"
requires-python = ">=3.10"
dependencies = ["databricks-sdk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lfc_saas_pipeline"]
